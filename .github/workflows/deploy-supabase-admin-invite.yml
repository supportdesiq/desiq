name: Deploy DESIQ admin invitation function

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/admin-invite/**'
      - '.github/workflows/deploy-supabase-admin-invite.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy admin-invite to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function and configure site URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID GitHub Actions secret."
            exit 1
          fi
          supabase functions deploy admin-invite --project-ref "$SUPABASE_PROJECT_ID" --yes
          supabase secrets set SITE_URL=https://desiq-kappa.vercel.app --project-ref "$SUPABASE_PROJECT_ID"
